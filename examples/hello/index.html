<!doctype html>

<title>homebase hello</title>
<style>
  body { font: 18px -apple-system, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #0f172a; color: #e2e8f0; text-align: center; }
  h1 { font-size: 44px; margin: 0 0 8px; }

</style>
