<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>ship</title>
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".55" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".62" r=".6">
      <stop offset="0" stop-color="#4C1D95" stop-opacity=".55"/>
      <stop offset="1" stop-color="#070B18" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0 H0 V16" fill="none" stroke="#1C2547" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect width="256" height="256" rx="56"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="#070B18"/>
    <rect width="256" height="256" fill="url(#grid)" opacity=".7"/>
    <rect width="256" height="256" fill="url(#halo)"/>
  </g>
  <rect x="1.5" y="1.5" width="253" height="253" rx="55" fill="none" stroke="url(#neon)" stroke-opacity=".35" stroke-width="3"/>
  <g filter="url(#glow)">
    <!-- sail: prompt chevron ">" on a mast -->
    <path d="M94 50 L158 102 L94 154 Z" fill="url(#neon)" fill-opacity=".18"/>
    <path d="M94 50 L158 102 L94 154" fill="none" stroke="url(#neon)" stroke-width="14" stroke-linejoin="miter" stroke-linecap="square"/>
    <line x1="94" y1="44" x2="94" y2="172" stroke="#E0F7FF" stroke-width="6"/>
    <!-- cursor "_" -->
    <rect x="168" y="144" width="30" height="10" fill="#F472B6">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <!-- hull -->
    <path d="M48 174 H208 L186 202 H70 Z" fill="url(#neon)" fill-opacity=".22" stroke="url(#neon)" stroke-width="6" stroke-linejoin="miter"/>
  </g>
  <!-- data stream -->
  <path d="M36 224 H220" stroke="#22D3EE" stroke-width="5" stroke-dasharray="14 10" opacity=".75">
    <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.2s" repeatCount="indefinite"/>
  </path>
</svg>
