<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a21caf"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="36" fill="url(#bg)"/>
  <rect width="160" height="80" rx="36" fill="url(#glow)"/>

  <g transform="translate(80 82) scale(.86) translate(-80 -71.5)">
  <!-- signal waves: the house announcing itself on the network -->
  <g fill="none" stroke="#fde68a" stroke-width="6" stroke-linecap="round">
    <path d="M69.4 31.4 A15 15 0 0 1 90.6 31.4"/>
    <path d="M61.6 23.6 A26 26 0 0 1 98.4 23.6" opacity=".7"/>
    <path d="M53.8 15.8 A37 37 0 0 1 106.2 15.8" opacity=".4"/>
  </g>

  <!-- house -->
  <path d="M28 82 L80 42 L132 82" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M42 74 V128 a6 6 0 0 0 6 6 H112 a6 6 0 0 0 6 -6 V74" fill="#ffffff" fill-opacity=".14" stroke="#fff" stroke-width="7" stroke-linejoin="round"/>

  <!-- server rack -->
  <g>
    <rect x="54" y="84" width="52" height="16" rx="4" fill="#1e1b4b"/>
    <circle cx="63" cy="92" r="3.5" fill="#4ade80"/>
    <rect x="72" y="90" width="26" height="4" rx="2" fill="#a5b4fc"/>
    <rect x="54" y="106" width="52" height="16" rx="4" fill="#1e1b4b"/>
    <circle cx="63" cy="114" r="3.5" fill="#4ade80"/>
    <rect x="72" y="112" width="18" height="4" rx="2" fill="#a5b4fc"/>
  </g>
  </g>
</svg>
